name: Publish crate

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Immutable release tag to publish
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  crates:
    if: vars.CARGO_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_ref) || github.ref }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Verify release tag and package
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          with open('Cargo.toml', 'rb') as manifest:
              package = tomllib.load(manifest)['package']
          assert package['name'] == 'brokk-tree-sitter-typescript'
          assert os.environ['RELEASE_TAG'] == 'v' + package['version']
          PY
          cargo test --locked
          cargo publish --dry-run --locked
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
