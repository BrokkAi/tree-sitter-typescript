name: Fuzz Parser

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/fuzz.yml
      - typescript/src/scanner.c
      - tsx/src/scanner.c
      - common/scanner.h
  pull_request:
    paths:
      - .github/workflows/fuzz.yml
      - typescript/src/scanner.c
      - tsx/src/scanner.c
      - common/scanner.h

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [typescript, tsx]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fuzz ${{matrix.language}} parser
        uses: tree-sitter/fuzz-action@6a1dcff00aefd038ba418bd63732a9add4901266 # v4
        env:
          PKG_CONFIG_PATH: ${{runner.tool_cache}}/tree-sitter/lib/share/pkgconfig:${{runner.tool_cache}}/tree-sitter/lib/lib/pkgconfig
        with:
          directory: ${{matrix.language}}
          corpus: test/fuzz
          # Older runtimes loop in error recovery on the saved seed, including
          # with the 0.23.5 baseline. Keep grammar generation pinned separately.
          # https://github.com/tree-sitter/tree-sitter/pull/5998
          tree-sitter-version: v0.27.1
          timeout: "10"
          max-time: "60"
          max-length: "4096"
