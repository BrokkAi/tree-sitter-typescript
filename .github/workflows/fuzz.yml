name: Fuzz Parser

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/fuzz.yml
      - typescript/src/scanner.c
      - tsx/src/scanner.c
      - common/scanner.h
  pull_request:
    paths:
      - .github/workflows/fuzz.yml
      - typescript/src/scanner.c
      - tsx/src/scanner.c
      - common/scanner.h

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [typescript, tsx]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fuzz ${{matrix.language}} parser
        uses: tree-sitter/fuzz-action@6a1dcff00aefd038ba418bd63732a9add4901266 # v4
        env:
          # The pinned runtime's CMake install uses share/pkgconfig.
          PKG_CONFIG_PATH: ${{runner.tool_cache}}/tree-sitter/lib/share/pkgconfig
        with:
          directory: ${{matrix.language}}
          tree-sitter-version: v0.24.4
