name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "common/**"
      - "*/grammar.js"
      - "*/src/**"
      - "bindings/**"
      - "binding.gyp"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - "tree-sitter.json"
      - "test/**"

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  core:
    name: Core grammar and Rust checks
    runs-on: ${{matrix.os}}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          cache: npm
          node-version: "24"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install pinned Tree-sitter CLI
        shell: bash
        run: |-
          npm ci --legacy-peer-deps --ignore-scripts
          npm rebuild tree-sitter-cli
      - name: Regenerate TypeScript and TSX parsers
        run: npm run generate
      - name: Verify generated outputs are stable
        run: git diff --exit-code -- typescript/src tsx/src
      - name: Run full TypeScript and TSX corpus
        run: npm run test:corpus
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Run locked Rust tests
        run: cargo test --locked
      - name: Validate crates.io package with locked dry run
        if: runner.os == 'Linux'
        run: |
          cargo package --locked
          cargo publish --dry-run --locked
      - name: Check out pinned upstream examples
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Snapshots from the upstream grammar baseline date, 2025-01-30.
          while read -r repository directory revision; do
            git init "examples/$directory"
            git -C "examples/$directory" remote add origin "https://github.com/$repository.git"
            git -C "examples/$directory" fetch --depth=1 origin "$revision"
            git -C "examples/$directory" checkout --detach FETCH_HEAD
          done <<'REVISIONS'
          desktop/desktop desktop 6a430d39a152349f94e59ae6a0e62f0df36ec643
          reduxjs/redux redux 52abf2b7044f62045579a48a3ab4b6f71c5fd319
          microsoft/vscode vscode f9c927cf7a29a59b896b6cdac2d8b5d2d43afea5
          REVISIONS
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Parse upstream examples
        if: runner.os == 'Linux'
        uses: tree-sitter/parse-action@f44ffa94f802024f27e821a72e6f2f3efc5dd521 # v4
        with:
          files: |
            examples/**/*.ts
            examples/**/*.tsx
            !examples/redux/src/types/store.ts
            !examples/vscode/src/bootstrap-window.ts
            !examples/vscode/extensions/vscode-colorize-perf-tests/test/colorize-fixtures/test-checker.ts

  bindings:
    name: Upstream binding checks
    runs-on: ${{matrix.os}}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Run binding checks
        uses: tree-sitter/parser-test-action@aba4a3de737f86f8ce83be38166a1ab521d4c960 # v2
        with:
          generate: false
          test-parser: false
          test-rust: false
          node-version: "24"
          test-node: true
          test-python: true
          test-go: true
          test-swift: true
